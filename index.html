<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tanishuv Olami</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7f4ff;
      color: #202020;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
    }

    .languages {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 45px;
    }

    .languages button {
      border: none;
      background: transparent;
      color: #8e4de8;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .languages .active {
      background: #8e4de8;
      color: white;
      padding: 7px 11px;
      border-radius: 10px;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: white;
      font-size: 34px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 28px;
    }

    .subtitle {
      margin: 12px 0 30px;
      text-align: center;
      color: #777;
      line-height: 1.5;
    }

    .form-card {
      padding: 22px;
      border-radius: 22px;
      background: white;
      box-shadow: 0 8px 24px rgba(90, 60, 130, 0.08);
    }

    .form-card h2 {
      margin: 0 0 8px;
      font-size: 23px;
    }

    .form-card p {
      margin: 0 0 22px;
      color: #777;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #934de8;
    }

    .gender-buttons {
      display: flex;
      gap: 10px;
    }

    .gender-button {
      flex: 1;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
      font-size: 16px;
      cursor: pointer;
    }

    .gender-button.selected {
      border-color: #934de8;
      background: #eee3ff;
      color: #7534c5;
      font-weight: bold;
    }

    .consent {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      margin-top: 22px;
      color: #666;
      font-size: 14px;
      line-height: 1.4;
    }

    .consent input {
      width: 18px;
      height: 18px;
      margin-top: 1px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-family: Arial, sans-serif;
      font-size: 16px;
      resize: vertical;
      outline: none;
    }

    .counter {
      margin-top: 6px;
      text-align: right;
      color: #777;
      font-size: 13px;
    }

    .error {
      min-height: 20px;
      margin-top: 12px;
      color: #d33b4b;
      font-size: 14px;
    }

    .continue-button {
      width: 100%;
      margin-top: auto;
      padding: 17px;
      border: none;
      border-radius: 16px;
      background: #934de8;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .continue-button:active {
      transform: scale(0.98);
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="languages">
      <button class="active">UZ</button>
      <button>RU</button>
      <button>EN</button>
    </div>

    <div class="logo">❤</div>

    <h1>Tanishuv Olami</h1>

    <p class="subtitle">
      O‘zingizga mos insonni toping va yangi tanishuvlarni boshlang.
    </p>

    <section id="basic-screen" class="form-card">
      <h2>Ma’lumotlaringiz</h2>

      <p>Ismingiz, yoshingiz va jinsingizni kiriting</p>

      <label for="name">Ism</label>

      <input
        id="name"
        type="text"
        placeholder="Ismingizni kiriting"
        maxlength="40"
      />

      <label for="age">Yosh</label>

      <input
        id="age"
        type="number"
        placeholder="Yoshingizni kiriting"
        min="18"
        max="100"
      />

      <label>Jins</label>

      <div class="gender-buttons">
        <button
          class="gender-button"
          onclick="selectGender('Erkak', this)"
        >
          Erkak
        </button>

        <button
          class="gender-button"
          onclick="selectGender('Ayol', this)"
        >
          Ayol
        </button>
      </div>

      <label class="consent">
        <input id="consent" type="checkbox" />

        <span>
          Men ommaviy oferta shartlarini o‘qib chiqdim va roziman.
        </span>
      </label>

      <div id="error" class="error"></div>
    </section>

    <section id="bio-screen" class="form-card hidden">
      <h2>O‘zingiz haqingizda</h2>

      <p>Qisqacha o‘zingiz haqingizda yozing</p>

      <label for="bio">Bio</label>

      <textarea
        id="bio"
        maxlength="500"
        placeholder="Salom, men..."
        oninput="updateCounter()"
      ></textarea>

      <div class="counter">
        <span id="bio-counter">0</span>/500
      </div>

      <div id="bio-error" class="error"></div>
    </section>

    <button
      id="continue-button"
      class="continue-button"
      onclick="continueRegistration()"
    >
      Davom etish
    </button>
  </main>

  <script>
    let selectedGender = "";
    let currentScreen = "basic";

    function selectGender(gender, button) {
      selectedGender = gender;

      document.querySelectorAll(".gender-button").forEach(function (item) {
        item.classList.remove("selected");
      });

      button.classList.add("selected");
    }

    function updateCounter() {
      const bio = document.getElementById("bio").value;

      document.getElementById("bio-counter").textContent = bio.length;
    }

    function continueRegistration() {
      const error = document.getElementById("error");
      const bioError = document.getElementById("bio-error");

      if (currentScreen === "basic") {
        const name = document.getElementById("name").value.trim();
        const age = Number(document.getElementById("age").value);
        const consent = document.getElementById("consent").checked;

        error.textContent = "";

        if (!name) {
          error.textContent = "Ismingizni kiriting.";
          return;
        }

        if (!age || age < 18) {
          error.textContent =
            "Ilovadan foydalanish uchun kamida 18 yoshda bo‘lishingiz kerak.";
          return;
        }

        if (!selectedGender) {
          error.textContent = "Jinsingizni tanlang.";
          return;
        }

        if (!consent) {
          error.textContent =
            "Davom etish uchun oferta shartlariga rozilik bering.";
          return;
        }

        localStorage.setItem(
          "userBasicInfo",
          JSON.stringify({
            name: name,
            age: age,
            gender: selectedGender,
            offerAccepted: true
          })
        );

        document
          .getElementById("basic-screen")
          .classList.add("hidden");

        document
          .getElementById("bio-screen")
          .classList.remove("hidden");

        currentScreen = "bio";
      } else {
        const bio = document.getElementById("bio").value.trim();

        bioError.textContent = "";

        if (bio.length < 20) {
          bioError.textContent =
            "O‘zingiz haqingizda kamida 20 ta belgi yozing.";
          return;
        }

        localStorage.setItem("userBio", bio);

        alert(
          "Ajoyib! Ma’lumotlaringiz va bio saqlandi."
        );
      }
    }
  </script>
</body>
</html>
