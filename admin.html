<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Malina Admin</title><style>body{margin:0;background:#090a0e;color:#eee;font-family:Arial}.wrap{max-width:1000px;margin:auto;padding:28px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#1b1e24;border:1px solid #373d46;border-radius:14px;padding:16px}.card b{display:block;font-size:26px}.muted{color:#9da5af;font-size:13px}.row{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #343a43}.btn{background:#e8edf2;color:#111;border:0;padding:12px 16px;border-radius:10px;font-weight:bold;cursor:pointer}textarea,input{background:#111318;color:#fff;border:1px solid #454b55;border-radius:9px;padding:12px;width:100%;box-sizing:border-box;margin:8px 0}.hidden{display:none}</style></head><body><main class="wrap"><h1>Malina Admin Panel</h1><p class="muted">ADMIN_TELEGRAM_ID bilan himoyalangan</p><input id="admin" placeholder="Admin Telegram ID"><button class="btn" onclick="load()">Dashboardni ochish</button><div id="app" class="hidden"><div class="cards"><div class="card"><b id="total">0</b><span class="muted">Jami user</span></div><div class="card"><b id="active">0</b><span class="muted">Faol user</span></div><div class="card"><b id="premium">0</b><span class="muted">Premium</span></div><div class="card"><b id="reports">0</b><span class="muted">Ochiq shikoyat</span></div></div><section class="panel"><h2>Foydalanuvchilar</h2><div id="users"></div></section><section class="panel"><h2>E’lon yuborish</h2><textarea id="text" rows="4" placeholder="Barcha foydalanuvchilarga xabar..."></textarea><button class="btn" onclick="broadcast()">E’lon yuborish</button><p id="result" class="muted"></p></section></div></main><script>let data;async function load(){let id=admin.value.trim();let r=await fetch('/api/admin/stats?admin_id='+encodeURIComponent(id));data=await r.json();if(!data.ok)return alert(data.error||'Ruxsat yo‘q');app.classList.remove('hidden');total.textContent=data.stats.total;active.textContent=data.stats.active;premium.textContent=data.stats.premium;reports.textContent=data.stats.open_reports;users.innerHTML=data.users.map(u=>`<div class="row"><span>${u.name||'—'}, ${u.age||''}<small class="muted"> ${u.city||''} · ${u.telegram_id}</small></span><button class="btn" onclick="block('${u.telegram_id}',${!u.is_blocked})">${u.is_blocked?'Ochish':'Bloklash'}</button></div>`).join('')}async function block(id,value){await fetch('/api/admin/block',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({admin_id:admin.value,target_id:id,blocked:value})});load()}async function broadcast(){let r=await fetch('/api/admin/broadcast',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({admin_id:admin.value,text:text.value})});let x=await r.json();result.textContent=x.ok?`Yuborildi: ${x.sent}, xato: ${x.failed}`:(x.error||'Xato')}</script></body></html>
