<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tanishuv Olami Admin</title><style>:root{font-family:Inter,Arial;color:#282331;background:#f6f1ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h1{margin:0}.pill{background:#eadcff;color:#763bc1;padding:9px 13px;border-radius:99px;font-weight:700}.box,.stat{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 8px 25px #50308012}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{display:block;font-size:29px;color:#8545d3}.muted{color:#777;font-size:13px}input,textarea,button{font:inherit}input,textarea{width:100%;padding:12px;border:1px solid #e4dcef;border-radius:12px;margin:7px 0 12px}textarea{min-height:100px}button{background:#8e47dc;border:0;color:#fff;font-weight:700;padding:12px 15px;border-radius:11px;cursor:pointer}.secondary{background:#eee6fa;color:#6c37a6}.danger{background:#dc5065}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tabs button{white-space:nowrap}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;font-size:13px}.hidden{display:none!important}.status{margin-top:10px;color:#6b5a78}@media(max-width:700px){.wrap{padding:13px}.grid{grid-template-columns:1fr 1fr}.top h1{font-size:21px}}
</style></head><body><main class="wrap"><div class="top"><h1>Tanishuv Olami</h1><span class="pill">ADMIN</span></div><section class="box"><b>Admin ID</b><input id="aid" inputmode="numeric" placeholder="Telegram ID raqamingiz"><div class="row"><button onclick="loadAll()">Kirish</button><button class="secondary" onclick="location.reload()">Yangilash</button></div><div id="status" class="status"></div></section><section id="app" class="hidden"><div class="grid"><div class="stat"><b id="total">0</b><span class="muted">Jami foydalanuvchi</span></div><div class="stat"><b id="male">0</b><span class="muted">Erkaklar</span></div><div class="stat"><b id="female">0</b><span class="muted">Ayollar</span></div><div class="stat"><b id="reportsCount">0</b><span class="muted">Ochiq shikoyatlar</span></div></div><div class="tabs"><button onclick="show('users')">Foydalanuvchilar</button><button onclick="show('broadcast')">E’lon yuborish</button><button onclick="show('reports')">Shikoyatlar</button></div><section id="users" class="box"><h2>Foydalanuvchilar</h2><div class="table"><table><thead><tr><th>ID</th><th>Ism</th><th>Yosh</th><th>Jins</th><th>Amal</th></tr></thead><tbody id="userRows"></tbody></table></div></section><section id="broadcast" class="box hidden"><h2>Barcha foydalanuvchilarga e’lon</h2><textarea id="message" placeholder="E’lon matni..."></textarea><button onclick="broadcast()">Yuborish</button><div id="broadcastStatus" class="status"></div></section><section id="reports" class="box hidden"><h2>Ochiq shikoyatlar</h2><div id="reportRows" class="muted">Yuklanmoqda...</div></section></section></main><script>const API='https://tanishuv-mini-app1.onrender.com';const $=id=>document.getElementById(id);const aid=()=>$("aid").value.trim();function show(id){['users','broadcast','reports'].forEach(x=>$(x).classList.toggle('hidden',x!==id));}function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function loadAll(){if(!aid())return $('status').textContent='Admin ID kiriting';$('status').textContent='Tekshirilmoqda...';try{const [sr,rr]=await Promise.all([fetch(API+'/api/admin/stats?admin_id='+encodeURIComponent(aid())),fetch(API+'/api/admin/reports?admin_id='+encodeURIComponent(aid()))]);const s=await sr.json(),r=await rr.json();if(!sr.ok||!s.ok)throw Error(s.error||'Ruxsat yo‘q');$('app').classList.remove('hidden');$('total').textContent=s.stats.total_users;$('male').textContent=s.stats.male_users;$('female').textContent=s.stats.female_users;$('reportsCount').textContent=(r.reports||[]).length;$('userRows').innerHTML=(s.stats.profiles||[]).map(u=>`<tr><td>${u.telegram_id}</td><td>${esc(u.name)}</td><td>${u.age}</td><td>${esc(u.gender)}</td><td><button class="danger" onclick="block(${u.telegram_id})">Bloklash</button></td></tr>`).join('');$('reportRows').innerHTML=(r.reports||[]).map(x=>`<div class="box"><b>#${x.id}</b> ${esc(x.reason)}<br><span class="muted">${x.reporter_id} → ${x.reported_id}</span> <button onclick="resolve(${x.id})">Yopish</button></div>`).join('')||'Ochiq shikoyat yo‘q';$('status').textContent='Panel tayyor';}catch(e){$('status').textContent=e.message}}async function block(id){if(!confirm('Foydalanuvchini bloklaysizmi?'))return;await fetch(API+'/api/admin/block',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({admin_id:aid(),user_id:id,blocked:true})});loadAll()}async function resolve(id){await fetch(API+'/api/admin/report/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({admin_id:aid(),report_id:id})});loadAll()}async function broadcast(){const text=$('message').value.trim();if(!text)return $('broadcastStatus').textContent='Xabar yozing';$('broadcastStatus').textContent='Yuborilmoqda...';const r=await fetch(API+'/api/admin/broadcast',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({admin_id:aid(),text})});const d=await r.json();$('broadcastStatus').textContent=d.ok?`Jami ${d.total}; yuborildi ${d.sent}; xato ${d.failed}`:d.error}</script></body></html>
